name: shad
description: >-
  A high-fidelity Flutter port of shadcn/ui: 40+ components, all eight shadcn
  styles and 16 color schemes, with no Material or Cupertino dependency.
version: 1.0.1
homepage: https://shad.serverpod.dev/
repository: https://github.com/serverpod/shad
issue_tracker: https://github.com/serverpod/shad/issues
documentation: https://shad.serverpod.dev/
topics:
  - user-interface
  - design-system
  - shadcn-ui
  - material-alternative
  - widgets
screenshots:
  - description: The shad component browser and theme editor.
    path: assets/screenshot.png

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  boxy: ^2.1.2
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.4.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  lucide_icons_flutter: ^4.0.1
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  # Not ^7.5: that needs Dart 3.13, above this package's Flutter 3.41 floor.
  theme_extensions_builder_annotation: ^7.1.0
  # Re-exported in part: ShadTableCell extends TableViewCell.
  two_dimensional_scrollables: ^0.5.3
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.12.2
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  slang_build_runner: ^4.19.0
  theme_extensions_builder: ^7.1.0
  very_good_analysis: ^10.0.0

