name: Flutter test

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"

jobs:
  check-imports:
    uses: ./.github/workflows/check-imports.yaml
  build-runner:
    uses: ./.github/workflows/build-runner.yml

  build:
    name: Flutter test
    runs-on: ubuntu-latest
    needs:
      - check-imports
      - build-runner
    concurrency:
      group: ${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: "stable"
          cache: true

      - name: Clean
        run: flutter clean

      # The package and the example app are two separate pub projects. Each
      # is analyzed and tested on its own so a broken export from the
      # package surfaces in whichever project actually consumes it.
      - name: Install and analyze package
        run: |
          flutter pub get
          flutter analyze

      - name: Check data-driven fixes (lib/fix_data.yaml)
        run: dart fix --compare-to-golden test_fixes

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: No bundled-font asset paths in lib
        # The deprecated kDefaultFontFamily constants keep their old values.
        run: |
          if grep -rn "packages/shad/" lib --exclude=text_styles_default.dart; then
            echo "::error::lib/ names a font asset shad no longer ships"
            exit 1
          fi

      - name: Publish dry run
        run: flutter pub publish --dry-run

      - name: Test package
        run: flutter test -r github --fail-fast

      # Web-only regressions (files tagged @TestOn('browser')) need a real
      # browser: the VM run above skips them. ubuntu-latest ships Chrome.
      # Only the *_web_test.dart files run here — the rest of the suite
      # (goldens especially) is written for the VM.
      - name: Test package on Chrome
        run: |
          find test -name '*_web_test.dart' -print0 \
            | xargs -0 flutter test -r github --fail-fast --platform chrome

      - name: Install and analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test -r github --fail-fast

      - name: Build example for web
        working-directory: example
        run: flutter build web --release

      - name: Downgrade dependencies
        run: |
          flutter pub downgrade
          flutter analyze --no-fatal-infos --no-fatal-warnings

  # The lowest Flutter the pubspec allows. pub downgrade lowers packages but
  # not the SDK, so the floor is only tested if a job runs on it.
  minimum-flutter:
    name: Analyze and test on minimum Flutter
    runs-on: ubuntu-latest
    needs:
      - check-imports
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.41.0"
          channel: "stable"
          cache: true

      - name: Analyze and test
        env:
          # Goldens are generated on the current stable engine; an older one
          # rasterises differently. This job checks the API, not the pixels.
          SHAD_SKIP_GOLDENS: "1"
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test -r github
