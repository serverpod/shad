name: Flutter test

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"

jobs:
  check-imports:
    uses: ./.github/workflows/check-imports.yaml
  build-runner:
    uses: ./.github/workflows/build-runner.yml

  build:
    name: Flutter test
    runs-on: ubuntu-latest
    needs:
      - check-imports
      - build-runner
    concurrency:
      group: ${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: "stable"
          cache: true

      - name: Clean
        run: flutter clean

      # The package and the example app are two separate pub projects. Each
      # is analyzed and tested on its own so a broken export from the
      # package surfaces in whichever project actually consumes it.
      - name: Install and analyze package
        run: |
          flutter pub get
          flutter analyze

      - name: Test package
        run: flutter test -r github --fail-fast

      - name: Install and analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test -r github --fail-fast

      - name: Downgrade dependencies
        run: |
          flutter pub downgrade
          flutter analyze --no-fatal-infos --no-fatal-warnings
