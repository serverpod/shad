name: Update goldens (Linux)

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Test file or directory to run
        required: false
        default: test
      test_name:
        description: Optional --plain-name filter (empty runs every test)
        required: false
        default: ""

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Regenerate goldens on Linux
        run: |
          if [ -n "${{ inputs.test_name }}" ]; then
            flutter test "${{ inputs.test_path }}" \
              --plain-name "${{ inputs.test_name }}" \
              --update-goldens
          else
            flutter test "${{ inputs.test_path }}" --update-goldens
          fi

      - name: Upload updated goldens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated-goldens
          path: |
            test/**/goldens/**
            example/test/**/goldens/**
