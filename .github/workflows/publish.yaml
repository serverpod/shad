name: Publish to pub.dev

# Publishes when a version tag is pushed. create-release.yaml creates the
# `v$VERSION` tag (with a PAT, so this workflow is triggered) after the tests
# pass on main. Automated publishing must be enabled for this repository and
# the `v{{version}}` tag pattern in the package admin page on pub.dev.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev OIDC
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: "stable"
          cache: true

      - name: Check the tag matches pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version $VERSION"
            exit 1
          fi

      - name: Publish
        run: |
          flutter pub get
          flutter pub publish --force
