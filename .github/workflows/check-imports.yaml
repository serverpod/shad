name: Check Prohibited Imports

on:
  workflow_call:

jobs:
  check-imports:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Check for prohibited imports
        run: |
          echo "Checking for prohibited Material and Cupertino imports in lib directory..."

          # Define excluded files
          EXCLUDED_FILES=(
            "lib/src/app.dart"
            "lib/src/theme/theme_scope.dart"
          )

          # Build grep exclusion pattern
          GREP_EXCLUDE=""
          for file in "${EXCLUDED_FILES[@]}"; do
            GREP_EXCLUDE="$GREP_EXCLUDE | grep -v \"$file\""
          done

          # Only match actual import lines, not doc comments that mention them.
          MATERIAL_IMPORTS=$(eval "grep -rE \"^[[:space:]]*import .*material\\.dart\" lib/ $GREP_EXCLUDE || true")

          # Check for cupertino.dart imports (excluding specified files)
          CUPERTINO_IMPORTS=$(eval "grep -rE \"^[[:space:]]*import .*cupertino\\.dart\" lib/ $GREP_EXCLUDE || true")

          # Check for shad.dart imports in lib directory
          SHAD_IMPORTS=$(grep -rE "^[[:space:]]*import .*shad/shad\.dart" lib/ || true)

          # Report all findings first
          FOUND_VIOLATIONS=false

          if [ ! -z "$MATERIAL_IMPORTS" ]; then
            echo "❌ Found prohibited material.dart imports:"
            echo "$MATERIAL_IMPORTS"
            FOUND_VIOLATIONS=true
          fi

          if [ ! -z "$CUPERTINO_IMPORTS" ]; then
            echo "❌ Found prohibited cupertino.dart imports:"
            echo "$CUPERTINO_IMPORTS"
            FOUND_VIOLATIONS=true
          fi

          if [ ! -z "$SHAD_IMPORTS" ]; then
            echo "❌ Found prohibited shad.dart imports:"
            echo "$SHAD_IMPORTS"
            FOUND_VIOLATIONS=true
          fi

          # Exit with error if any violations were found
          if [ "$FOUND_VIOLATIONS" = true ]; then
            exit 1
          fi

          echo "✅ No prohibited imports found!"
